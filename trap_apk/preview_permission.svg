<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- Dialog white background -->
  <rect x="0" y="0" width="300" height="200" rx="4" ry="4" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Title - black bold -->
  <text x="24" y="38" font-family="Arial, sans-serif" font-size="18" fill="#000000" font-weight="bold">Allow location access?</text>

  <!-- Message - dark gray, left aligned -->
  <text x="24" y="72" font-family="Arial, sans-serif" font-size="14" fill="#555555">This app wants to access your device</text>
  <text x="24" y="92" font-family="Arial, sans-serif" font-size="14" fill="#555555">location to provide nearby results and</text>
  <text x="24" y="112" font-family="Arial, sans-serif" font-size="14" fill="#555555">personalized recommendations.</text>

  <!-- Divider -->
  <line x1="24" y1="136" x2="276" y2="136" stroke="#eeeeee" stroke-width="1"/>

  <!-- Cancel button - left half, gray text -->
  <text x="75" y="168" font-family="Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle">Cancel</text>

  <!-- OK button - right half, Google blue -->
  <text x="225" y="168" font-family="Arial, sans-serif" font-size="14" fill="#1A73E8" text-anchor="middle" font-weight="bold">OK</text>
</svg>